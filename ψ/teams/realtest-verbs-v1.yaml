#    ⇒ ตรวจ: verify-check.sh enginecheck <charter> → enginecheck.prompt-delivery:
# Real-usage test of the verbs arnon says are NOT yet proven: dispatch / lead / down.
# `up` is already proven by ajfon (bootverify caught codex stuck on an update dialog).
# Charter deliberately small: 2 workers, throwaway task, teardown is the point.
name: realtest-verbs-v1
project: arnon2020/codex-fanout
session: realtest-verbs-v1

goal: |
  Exercise dispatch -> lead -> down for real and record what breaks.
  The work product is the DEFECT LIST, not the code the workers write.

members:
  - role: worker-a
    name: worker-a
    engine: sage-opencode-oracle
    worktree: agents/realtest-worker-a
    branch: agents/realtest-worker-a
    prompt: |
      Coder. WAIT for a task via maw hey. Do the smallest correct thing in YOUR worktree only.
      Report back with: maw hey realtest-verbs-v1:lead "done|blocked — <detail>"
      Never touch the lead checkout or the other worker's worktree.
      END EVERY TURN WITH SOMETHING IN FLIGHT. Before you stop, at least one must be true:
      1. you dispatched an agent AND it is consuming — check the pane; delivered != consumed
      2. a script or background job is running
      3. a watcher is armed, so the next event wakes you
      4. the turn genuinely ends the program — and you SAY SO explicitly
      Prose is a report ON work, never a substitute FOR it. If your analysis produced no next
      action, that IS the finding: say it plainly rather than letting silence imply progress.
      Do not generate work by replying — when a counterpart says nothing is outstanding, the
      next action is the task, not a better acknowledgement.
      [scaffold for a measured failure — retire when turns reliably end in flight without it]
  - role: worker-b
    name: worker-b
    engine: sage-opencode-oracle
    worktree: agents/realtest-worker-b
    branch: agents/realtest-worker-b
    prompt: |
      Coder. WAIT for a task via maw hey. Do the smallest correct thing in YOUR worktree only.
      Report back with: maw hey realtest-verbs-v1:lead "done|blocked — <detail>"
      Never touch the lead checkout or the other worker's worktree.
      END EVERY TURN WITH SOMETHING IN FLIGHT. Before you stop, at least one must be true:
      1. you dispatched an agent AND it is consuming — check the pane; delivered != consumed
      2. a script or background job is running
      3. a watcher is armed, so the next event wakes you
      4. the turn genuinely ends the program — and you SAY SO explicitly
      Prose is a report ON work, never a substitute FOR it. If your analysis produced no next
      action, that IS the finding: say it plainly rather than letting silence imply progress.
      Do not generate work by replying — when a counterpart says nothing is outstanding, the
      next action is the task, not a better acknowledgement.
      [scaffold for a measured failure — retire when turns reliably end in flight without it]
  - role: lead
    name: lead
    engine: claude-opus
    worktree: false
    branch: main

lifecycle:
  worktree: true
  merge_on_shutdown: false
