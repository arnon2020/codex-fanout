# Engine: sage-opencode-oracle = opencode --model zai/glm-5.2 --auto
# Testing opencode as coder instead of codex (2026-07-25)
name: codex-fanout-team
project: arnon2020/codex-fanout
session: 117-codex-fanout

goal: |
  Lead (Claude) dispatches tasks to a single opencode coder in an isolated worktree.
  Coder owns the loop to done-criteria. PR -> alpha only, never main.

members:
  - role: opencode-1
    name: opencode-1
    engine: sage-opencode-oracle
    worktree: agents/opencode-1
    branch: agents/opencode-1
    prompt: |
      Coder. WAIT for task via maw hey.
      Implement MINIMAL precise code in YOUR worktree.
      OWN the loop: implement -> test -> fix -> repeat until done-criteria met.
      Report back via: maw hey 117-codex-fanout:codex-fanout "done/blocked — <details>"
      Never touch lead's checkout or other worktrees.
      PR -> alpha branch only, never main.

  - role: lead
    name: codex-fanout
    engine: claude
    worktree: false
    branch: alpha

lifecycle:
  worktree: true
  merge_on_shutdown: false
