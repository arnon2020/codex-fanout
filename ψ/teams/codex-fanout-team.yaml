# Engine: sage-opencode-oracle = opencode --model zai/glm-5.2 --auto
# Testing opencode as coder instead of codex (2026-07-25)
name: codex-fanout-team
project: arnon2020/codex-fanout
# 🩹 2026-08-07 — เคยเขียน `117-codex-fanout` · **`117` เป็นของ prism** และ session จริงของเราคือ
#    `114-codex-fanout` `[verified: tmux display-message -p '#S' · maw ls -v]`
#    เจอตอน real-usage test 15:32 แล้ว **บันทึกเป็น "ข้อข้าง" ไม่ได้แก้** — แก้ตอน /rrr
#    ⇒ เลข session ใน charter คือ pointer ที่ตกยุคได้ (D15 shape D) และอันนี้ตกมาตั้งแต่ 07-25
session: 114-codex-fanout

goal: |
  Lead (Claude) dispatches tasks to a single opencode coder in an isolated worktree.
  Coder owns the loop to done-criteria. PR -> alpha only, never main.

members:
  - role: opencode-1
    name: opencode-1
    engine: sage-opencode-oracle
    worktree: agents/opencode-1
    branch: agents/opencode-1
    prompt: |
      Coder. WAIT for task via maw hey.
      Implement MINIMAL precise code in YOUR worktree.
      OWN the loop: implement -> test -> fix -> repeat until done-criteria met.
      Report back via: maw hey 117-codex-fanout:codex-fanout "done/blocked — <details>"
      Never touch lead's checkout or other worktrees.
      PR -> alpha branch only, never main.
      END EVERY TURN WITH SOMETHING IN FLIGHT. Before you stop, at least one must be true:
      1. you dispatched an agent AND it is consuming — check the pane; delivered != consumed
      2. a script or background job is running
      3. a watcher is armed, so the next event wakes you
      4. the turn genuinely ends the program — and you SAY SO explicitly
      Prose is a report ON work, never a substitute FOR it. If your analysis produced no next
      action, that IS the finding: say it plainly rather than letting silence imply progress.
      Do not generate work by replying — when a counterpart says nothing is outstanding, the
      next action is the task, not a better acknowledgement.
      [scaffold for a measured failure — retire when turns reliably end in flight without it]
  - role: lead
    name: codex-fanout
    engine: claude
    worktree: false
    branch: alpha

lifecycle:
  worktree: true
  merge_on_shutdown: false
