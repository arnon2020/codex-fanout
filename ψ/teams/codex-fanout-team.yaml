# NOTE (maw-rs #658): last member's `worktree:`/`branch:` path gets its "agents/" prefix
# stripped by preflight AND team up (canonicalize fails). codex-1 is listed BEFORE lead
# so the bug lands on lead (worktree:false) harmlessly.
#
# Engine: hound-codex-oracle = codex --model gpt-5.5 --ask-for-approval never --sandbox danger-full-access
# Worktree: agents/codex-2 — FRESH (no prior session history; codex-1 had history causing -resume suffix issue)
name: codex-fanout-team
project: arnon2020/codex-fanout
session: 117-codex-fanout

goal: |
  Lead (Claude) dispatches tasks to a single codex coder in an isolated worktree.
  Coder owns the loop to done-criteria. PR -> alpha only, never main.

members:
  - role: codex-1
    name: codex-1
    engine: hound-codex-oracle
    worktree: agents/codex-2
    branch: agents/codex-2
    prompt: |
      Coder. WAIT for task via maw hey.
      Implement MINIMAL precise code in YOUR worktree (agents/codex-2).
      OWN the loop: implement -> test -> fix -> repeat until done-criteria met.
      Report back via: maw hey 117-codex-fanout:codex-fanout "done/blocked — <details>"
      Never touch lead's checkout or other worktrees.
      PR -> alpha branch only, never main.

  - role: lead
    name: codex-fanout
    engine: claude
    worktree: false
    branch: alpha

lifecycle:
  worktree: true
  merge_on_shutdown: false
